<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance OS — Catorcena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar"></div>
    <main class="main">
      <div id="content"></div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('sidebar').outerHTML = renderSidebar('cat');

    const s = getDashboardStats();
    const actuals = getCategoryActuals();
    const fmtRange = (d1, d2) => {
      const opts = { month: 'short', day: 'numeric' };
      return d1.toLocaleDateString('en-US', opts) + ' → ' + d2.toLocaleDateString('en-US', opts);
    };

    const variablePct = (actuals.variable / state.catorcena.variable) * 100;
    const periodPct = ((14 - s.cat.daysLeft) / 14) * 100;

    let insight, insightClass;
    if (variablePct > 100) {
      insight = `<strong>⚠️ Variable budget exceeded.</strong> You've spent ${mxn(actuals.variable)} on food, transport, and impulse — ${mxn(actuals.variable - state.catorcena.variable)} over plan with ${s.cat.daysLeft} days still to go. The next variable expense pulls from car or Brazil savings.`;
      insightClass = 'warn';
    } else if (variablePct > periodPct + 15) {
      insight = `<strong>💡 Slow down.</strong> You're ${Math.round(variablePct)}% through variable budget with only ${Math.round(periodPct)}% of the period gone. Cap food-out at ${mxn(s.safeDaily * 0.6)}/day for the remaining ${s.cat.daysLeft} days.`;
      insightClass = 'warn';
    } else if (s.safeDaily > 100) {
      insight = `<strong>✓ You can spend safely.</strong> Variable spending is on pace. ${mxn(s.safeDaily)}/day stays inside budget for the next ${s.cat.daysLeft} days.`;
      insightClass = 'good';
    } else {
      insight = `<strong>Track gently.</strong> You're on pace but tight. Be deliberate with food and transport for the rest of the period.`;
      insightClass = '';
    }

    document.getElementById('content').innerHTML = `
      <div class="page-head fade-in">
        <div>
          <div class="eyebrow">💰 Money / Catorcenas</div>
          <h1 class="page-title">${fmtRange(s.cat.start, s.cat.end)}</h1>
          <div class="page-sub">${s.status} · ${s.cat.daysLeft} days remaining · ${mxn(s.safeDaily)}/day variable</div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-head">
          <div class="card-title">Planned vs actual</div>
          <div class="card-meta">${mxn(state.income.biweekly)} biweekly</div>
        </div>
        <table class="budget-table">
          <thead>
            <tr>
              <th>Category</th>
              <th class="num">Plan</th>
              <th class="num">Actual</th>
              <th class="num">Left</th>
              <th class="num" style="width:120px">Progress</th>
            </tr>
          </thead>
          <tbody>
            ${row('Fixed expenses', state.catorcena.fixed, actuals.fixed)}
            ${row('Variable', state.catorcena.variable, actuals.variable)}
            ${row('YouTube', state.catorcena.youtube, actuals.youtube)}
            ${row('Crypto DCA', state.catorcena.crypto, actuals.crypto)}
            ${state.goals.map(g => row(g.name, g.biweeklyAmount || 0, actuals[g.id] || 0)).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td>Total</td>
              <td class="num">${mxn(state.catorcena.fixed + state.catorcena.variable + state.catorcena.youtube + state.catorcena.crypto + state.goals.reduce((s,g) => s + (g.biweeklyAmount || 0), 0))}</td>
              <td class="num">${mxn(actuals.fixed + actuals.variable + actuals.youtube + actuals.crypto + state.goals.reduce((s,g) => s + (actuals[g.id] || 0), 0))}</td>
              <td class="num">${mxn(state.income.biweekly - s.totalSpent)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>

        <div class="insight ${insightClass}" style="margin-top:1.5rem">${insight}</div>
      </div>

      <div class="btn-row fade-in">
        <button class="btn primary" onclick="runCatorcenaSetup()">⚡ Run Catorcena Setup</button>
        <a href="transactions.html" class="btn">View transactions →</a>
      </div>
    `;

    function row(label, plan, actual) {
      const pct = plan > 0 ? Math.min(100, (actual / plan) * 100) : 0;
      const left = plan - actual;
      const cls = pct >= 100 ? 'done' : pct >= 85 ? 'bad' : pct >= 60 ? 'warn' : '';
      const leftDisplay = pct >= 100 ? '<span style="color:var(--good)">✓</span>' : mxn(left);
      return `<tr>
        <td class="cat">${label}</td>
        <td class="num">${mxn(plan)}</td>
        <td class="num">${mxn(actual)}</td>
        <td class="num">${leftDisplay}</td>
        <td class="num"><span class="mini-bar"><div class="${cls}" style="width:${pct}%"></div></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-mute)">${Math.round(pct)}%</span></td>
      </tr>`;
    }

    mountAddModal();
  </script>
</body>
</html>
