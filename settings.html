<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance OS — Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar"></div>
    <main class="main">
      <div id="content"></div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('sidebar').outerHTML = renderSidebar('settings');

    const sizeKB = (JSON.stringify(state).length / 1024).toFixed(1);

    // Migrate planned/catorcena to an editable list if not yet done
    if (!state.budgetCategories) {
      state.budgetCategories = [
        { id: 'fixed', name: 'Fixed expenses (subs, gym, etc)', monthly: state.planned.fixed || 5319, biweekly: state.catorcena.fixed || 2660, locked: true, key: 'fixed' },
        { id: 'variable', name: 'Variable (food/transport/impulse)', monthly: state.planned.variable || 2031, biweekly: state.catorcena.variable || 1015, locked: true, key: 'variable' },
        { id: 'youtube', name: 'YouTube investment', monthly: state.planned.youtube || 1500, biweekly: state.catorcena.youtube || 750, locked: false, key: 'youtube' },
        { id: 'crypto', name: 'Crypto DCA', monthly: state.planned.crypto || 1000, biweekly: state.catorcena.crypto || 500, locked: false, key: 'crypto' },
      ];
      saveState();
    }

    function getBudgetRows() {
      return state.budgetCategories.map(b => `
        <tr>
          <td class="cat">
            <input class="inline-edit" type="text" value="${b.name}" onchange="updateBudgetField('${b.id}', 'name', this.value)" style="width:100%;max-width:none;text-align:left;font-family:inherit;font-size:13px">
            ${b.locked ? '<span style="font-size:10px;color:var(--ink-mute);margin-left:6px" title="Esta categoría se usa para cálculos del sistema">🔒</span>' : ''}
          </td>
          <td class="num">
            <input class="inline-edit" type="number" value="${b.monthly}" onchange="updateBudgetField('${b.id}', 'monthly', this.value)" style="width:90px;text-align:right;font-family:var(--font-mono);font-size:12px">
          </td>
          <td class="num">
            <input class="inline-edit" type="number" value="${b.biweekly}" onchange="updateBudgetField('${b.id}', 'biweekly', this.value)" style="width:90px;text-align:right;font-family:var(--font-mono);font-size:12px">
          </td>
          <td>
            ${b.locked ? '' : `<button onclick="deleteBudgetCategory('${b.id}')" style="background:none;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer" title="Quitar">×</button>`}
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('content').innerHTML = `
      <div class="page-head fade-in">
        <div>
          <div class="eyebrow">⚙ System / Settings</div>
          <h1 class="page-title"><em>Settings</em> &amp; data</h1>
          <div class="page-sub">Backup, restore, and tune the system</div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-head">
          <div class="card-title">📅 Catorcena setup</div>
          <div class="card-meta">Cuándo es tu día de pago</div>
        </div>
        <p style="font-size:14px;color:var(--ink-soft);line-height:1.7;margin-bottom:1rem">
          Define cualquier fecha en la que sabes que recibiste o vas a recibir pago. El sistema calcula automáticamente todas las catorcenas (cada 14 días) desde ahí.
        </p>
        <div style="display:flex;gap:1rem;align-items:end">
          <div>
            <label style="font-size:11px;color:var(--ink-mute);letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:6px">Fecha de pago de referencia</label>
            <input type="date" id="payday-anchor" value="${state.income.paydayAnchor}" onchange="updatePaydayAnchor(this.value)" style="padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg-elev);font-family:inherit;font-size:14px">
          </div>
          <div style="font-size:13px;color:var(--ink-soft);padding-bottom:8px">
            Catorcena actual: <strong>${currentCatorcena().start.toLocaleDateString('es-MX')} → ${currentCatorcena().end.toLocaleDateString('es-MX')}</strong><br>
            Próximo pago: <strong>${currentCatorcena().nextPayday.toLocaleDateString('es-MX')}</strong>
          </div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-head">
          <div class="card-title">💾 Backup &amp; restore</div>
          <div class="card-meta">${sizeKB} KB used</div>
        </div>
        <p style="font-size:14px;color:var(--ink-soft);line-height:1.7">
          Your data lives only in this browser. Export weekly to keep a safe copy. Import to restore or sync across devices.
        </p>
        <div class="btn-row">
          <button class="btn primary" onclick="exportData()">⬇ Export backup (JSON)</button>
          <label class="btn" style="cursor:pointer">
            ⬆ Import backup
            <input type="file" accept=".json" onchange="if(this.files[0])importData(this.files[0])" style="display:none">
          </label>
          <button class="btn" onclick="resetData()" style="color:var(--bad)">⟲ Reset to defaults</button>
        </div>
        <div class="insight warn" style="margin-top:1.25rem">
          <strong>Important:</strong> Clearing browser data, switching browsers, or using incognito mode will lose your transactions. Back up every Sunday during the weekly review.
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-head">
          <div class="card-title">💰 Budget configuration</div>
          <div class="card-meta">Edita, agrega o quita categorías</div>
        </div>
        <table class="budget-table">
          <thead><tr><th>Categoría</th><th class="num">Mensual (MXN)</th><th class="num">Catorcena (MXN)</th><th style="width:40px"></th></tr></thead>
          <tbody id="budget-tbody">
            ${getBudgetRows()}
          </tbody>
        </table>
        <div class="btn-row" style="margin-top:1rem">
          <button class="btn primary" onclick="addBudgetCategory()">+ Agregar categoría</button>
        </div>
        <div class="smart-insight" style="margin-top:1rem">
          💡 Si quitas una categoría, los gastos ya registrados se quedan en el historial pero ya no se muestra en el dashboard. Si quieres ver "Safe today" correctamente, mantén "Variable" siempre.
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-head"><div class="card-title">📦 Data summary</div></div>
        <table class="budget-table">
          <tr><td class="cat">Total transactions</td><td class="num">${state.transactions.length}</td></tr>
          <tr><td class="cat">Active goals</td><td class="num">${state.goals.length}</td></tr>
          <tr><td class="cat">Reviews saved</td><td class="num">${state.reviews.length}</td></tr>
          <tr><td class="cat">YouTube channels</td><td class="num">${state.youtube.channels.length}</td></tr>
          <tr><td class="cat">YouTube sessions logged</td><td class="num">${state.youtube.sessions.length}</td></tr>
          <tr><td class="cat">Crypto assets</td><td class="num">${state.crypto.assets.length}</td></tr>
          <tr><td class="cat">Crypto movements</td><td class="num">${state.crypto.movements.length}</td></tr>
          <tr><td class="cat">Storage used</td><td class="num">${sizeKB} KB</td></tr>
        </table>
      </div>

      <div class="card fade-in">
        <div class="card-title" style="margin-bottom:1rem">ℹ️ About this version</div>
        <p style="font-size:14px;color:var(--ink-soft);line-height:1.7">
          <strong>v2 changes:</strong>
        </p>
        <ul style="font-size:13px;color:var(--ink-soft);line-height:1.9;margin-left:1rem;margin-top:0.5rem">
          <li>YouTube and Crypto are now separate pages with their own features</li>
          <li>Goals are fully editable (name, target, monthly, color, delete)</li>
          <li>Crypto tracks deposits, buys, sells, withdrawals separately — see real net P&L</li>
          <li>Crypto prices auto-fetch from CoinGecko (free, no key needed)</li>
          <li>YouTube tracks revenue, time per channel, and effort/payoff chart</li>
          <li>Quick-entry buttons on home page for fast logging</li>
          <li>Habits tracker removed (was unused)</li>
        </ul>
      </div>
    `;

    function updateBudgetField(id, field, value) {
      const b = state.budgetCategories.find(x => x.id === id);
      if (!b) return;
      if (field === 'monthly' || field === 'biweekly') {
        const num = parseFloat(value) || 0;
        b[field] = num;
        // Sync to legacy state.planned/state.catorcena for locked categories
        if (b.locked && b.key) {
          if (field === 'monthly') state.planned[b.key] = num;
          if (field === 'biweekly') state.catorcena[b.key] = num;
        }
      } else {
        b[field] = value;
      }
      saveState();
    }

    function addBudgetCategory() {
      const name = prompt('Nombre de la categoría:');
      if (!name) return;
      const monthly = parseFloat(prompt('Monto mensual (MXN):') || '0') || 0;
      const biweekly = parseFloat(prompt('Monto por catorcena (MXN):') || '0') || Math.round(monthly / 2);
      state.budgetCategories.push({
        id: 'bc' + Date.now(),
        name,
        monthly,
        biweekly,
        locked: false,
      });
      saveState();
      location.reload();
    }

    function deleteBudgetCategory(id) {
      const b = state.budgetCategories.find(x => x.id === id);
      if (!b) return;
      if (b.locked) { alert('Esta categoría está bloqueada porque el sistema la usa para cálculos.'); return; }
      if (!confirm('Quitar "' + b.name + '" del presupuesto?\n\nLas transacciones registradas se quedan en el historial.')) return;
      state.budgetCategories = state.budgetCategories.filter(x => x.id !== id);
      saveState();
      location.reload();
    }

    function updatePaydayAnchor(val) {
      state.income.paydayAnchor = val;
      saveState();
      location.reload();
    }

    mountAddModal();
  </script>
</body>
</html>
