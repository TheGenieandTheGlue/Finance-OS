<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance OS — Crypto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar"></div>
    <main class="main">
      <div id="content"></div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('sidebar').outerHTML = renderSidebar('cr');

    let updating = false;

    function getSimpleStats() {
      const usdMxnRate = state.crypto.usdMxnRate || 17;
      let totalCurrentMXN = 0;
      let totalInvestedMXN = 0;

      const assets = state.crypto.assets.map(a => {
        const qty = a.holdings || 0;
        const invested = a.investedMXN || 0;
        const currentValueMXN = qty * a.currentPrice;
        const pl = currentValueMXN - invested;
        const plPct = invested > 0 ? Math.round((pl / invested) * 100) : 0;
        totalCurrentMXN += currentValueMXN;
        totalInvestedMXN += invested;
        return { ...a, qty, invested, currentValueMXN, pl, plPct };
      });

      const totalPL = totalCurrentMXN - totalInvestedMXN;
      const totalPLPct = totalInvestedMXN > 0 ? Math.round((totalPL / totalInvestedMXN) * 100) : 0;

      return { assets, totalCurrentMXN, totalInvestedMXN, totalPL, totalPLPct, usdMxnRate };
    }

    async function render() {
      const s = getSimpleStats();
      const lastUpdate = state.crypto.lastPriceUpdate
        ? 'Last update: ' + new Date(state.crypto.lastPriceUpdate).toLocaleString('es-MX')
        : 'Never updated';

      const returnColor = s.totalPL >= 0 ? 'var(--good)' : 'var(--bad)';
      const returnSign = s.totalPL >= 0 ? '+' : '';

      document.getElementById('content').innerHTML = `
        <div class="page-head fade-in">
          <div>
            <div class="eyebrow">📈 Growth / Crypto</div>
            <h1 class="page-title">Your <em>portfolio</em></h1>
            <div class="page-sub">${lastUpdate} · USD/MXN: ${s.usdMxnRate.toFixed(2)}</div>
          </div>
          <div>
            <button class="btn primary" onclick="refreshPrices()" id="refresh-btn">${updating ? '⏳ Updating...' : '↻ Update prices'}</button>
          </div>
        </div>

        <div class="card fade-in" style="background:${s.totalPL >= 0 ? '#F4F8F2' : '#FBEFEB'};border-color:${returnColor}">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:center">
            <div>
              <div class="eyebrow">Profit / Loss (P&amp;L)</div>
              <div style="font-family:var(--font-display);font-size:42px;font-weight:500;letter-spacing:-0.02em;color:${returnColor};margin-top:6px">${returnSign}${mxn(s.totalPL)}</div>
              <div style="font-size:14px;color:${returnColor};margin-top:4px">${returnSign}${s.totalPLPct}% sobre ${mxn(s.totalInvestedMXN)} invertidos</div>
            </div>
            <div style="font-size:13px;color:var(--ink-soft);line-height:1.8">
              <strong>Cuánto tengo en total:</strong><br>
              Valor actual: <strong style="font-size:18px;color:var(--ink)">${mxn(s.totalCurrentMXN)} MXN</strong><br>
              ${s.totalPL >= 0
                ? `<span style="color:var(--good)"><strong>Si vendieras todo ahora, ganarías ${mxn(s.totalPL)}.</strong></span>`
                : `<span style="color:var(--bad)"><strong>Si vendieras todo ahora, perderías ${mxn(Math.abs(s.totalPL))}.</strong></span>`}
            </div>
          </div>
        </div>

        <div class="card fade-in">
          <div class="card-head">
            <div class="card-title">My holdings</div>
            <div class="card-meta">Edit holdings &amp; cost basis directly</div>
          </div>
          ${s.assets.length === 0 ? `
            <div class="empty"><em>No assets tracked.</em><br>Add an asset below.</div>
          ` : `
            <table class="budget-table">
              <thead>
                <tr>
                  <th>Asset</th>
                  <th class="num">Holdings</th>
                  <th class="num">Price (USD)</th>
                  <th class="num">Price (MXN)</th>
                  <th class="num">Value (MXN)</th>
                  <th class="num">Invested (MXN)</th>
                  <th class="num">P&amp;L</th>
                </tr>
              </thead>
              <tbody>
                ${s.assets.map(a => `
                  <tr>
                    <td class="cat" style="font-weight:500">
                      ${a.symbol}
                      ${a.autoPrice && COINGECKO_IDS[a.symbol] ? '<span style="font-size:10px;color:var(--ink-mute);margin-left:6px">⟳ auto</span>' : ''}
                      <button onclick="deleteAsset('${a.id}')" style="background:none;border:none;color:var(--ink-faint);font-size:12px;cursor:pointer;margin-left:8px" title="Remove asset">×</button>
                    </td>
                    <td class="num">
                      <input class="inline-edit" type="number" step="0.0000001" value="${a.qty}" onchange="updateHolding('${a.id}', this.value)" placeholder="0.0">
                    </td>
                    <td class="num">${a.currentPriceUsd > 0 ? '$' + a.currentPriceUsd.toLocaleString('en-US', {maximumFractionDigits: 2}) : '—'}</td>
                    <td class="num">${a.autoPrice
                      ? mxn(a.currentPrice)
                      : `<input class="inline-edit" type="number" step="0.01" value="${a.currentPrice}" onchange="updatePrice('${a.id}', this.value)">`}</td>
                    <td class="num" style="font-weight:500">${mxn(a.currentValueMXN)}</td>
                    <td class="num">
                      <input class="inline-edit" type="number" step="1" value="${a.invested}" onchange="updateInvested('${a.id}', this.value)" placeholder="0">
                    </td>
                    <td class="num" style="color:${a.pl >= 0 ? 'var(--good)' : 'var(--bad)'}">
                      ${a.pl >= 0 ? '+' : ''}${mxn(a.pl)}
                      <br><span style="font-size:10px">${a.plPct >= 0 ? '+' : ''}${a.plPct}%</span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr>
                  <td>Total</td>
                  <td class="num">—</td>
                  <td class="num">—</td>
                  <td class="num">—</td>
                  <td class="num">${mxn(s.totalCurrentMXN)}</td>
                  <td class="num">${mxn(s.totalInvestedMXN)}</td>
                  <td class="num" style="color:${s.totalPL >= 0 ? 'var(--good)' : 'var(--bad)'}">${s.totalPL >= 0 ? '+' : ''}${mxn(s.totalPL)}</td>
                </tr>
              </tfoot>
            </table>
          `}

          <div class="smart-insight" style="margin-top:1rem">
            💡 <strong>Cómo usar:</strong> Pon en "Holdings" cuántas unidades tienes de cada crypto (ej: 0.0042 BTC). En "Invested" pon el total de MXN que has metido a ese activo. La app calcula tu valor actual y P&amp;L en vivo.
          </div>

          <div class="btn-row">
            <button class="btn primary" onclick="addAsset()">+ Add asset</button>
            <button class="btn" onclick="refreshPrices()">↻ Update prices</button>
          </div>
        </div>

        ${getSmartAllocation()}
      `;

      mountAddModal();
    }

    function getSmartAllocation() {
      const goals = getGoalProgress();
      const s = getSimpleStats();

      // ESTRATEGIA:
      // 1. Para cada meta, calculamos cuántos meses tardas en llegar al pace actual.
      // 2. Si la meta está a > 6 meses, parte de lo que ya tienes guardado se puede mover a crypto
      //    porque el monthly inflow llenará el "hueco" antes de que necesites el dinero.
      // 3. La regla: puedes invertir hasta (currentSaved - safetyBuffer) donde safetyBuffer
      //    es lo que necesitarás en los próximos 3 meses (colchón) — pero solo si la meta está lejos.
      // 4. El % máximo a mover depende del horizonte: más lejos = más permisible.

      const SAFETY_MONTHS = 3; // colchón de seguridad: no toques lo que necesitas en próximos 3 meses

      const goalAnalysis = goals.map(g => {
        const remainingMXN = g.target - g.current;
        const monthsToGoal = g.monthly > 0 ? remainingMXN / g.monthly : Infinity;
        const currentSaved = g.current;

        // "Safety buffer": cuánto del current saved necesitas mantener líquido
        // Si la meta es en X meses y X < SAFETY_MONTHS, necesitas TODO líquido
        // Si X > SAFETY_MONTHS, necesitas mantener (SAFETY_MONTHS * monthly) líquido como buffer
        let liquidNeeded;
        if (monthsToGoal <= SAFETY_MONTHS) {
          liquidNeeded = currentSaved; // todo líquido, ya casi llegas
        } else {
          // Mantén el equivalente a SAFETY_MONTHS de aporte líquido
          liquidNeeded = Math.min(currentSaved, SAFETY_MONTHS * g.monthly);
        }

        // Excedente que técnicamente podría mover a crypto
        const excess = Math.max(0, currentSaved - liquidNeeded);

        // % máximo del excedente según horizonte (más lejos = más agresivo)
        let maxPctOfExcess, label, labelColor;
        if (monthsToGoal > 18) {
          maxPctOfExcess = 0.30; label = 'Largo plazo'; labelColor = 'var(--good)';
        } else if (monthsToGoal > 12) {
          maxPctOfExcess = 0.20; label = 'Lejano'; labelColor = 'var(--good)';
        } else if (monthsToGoal > 6) {
          maxPctOfExcess = 0.10; label = 'Medio'; labelColor = 'var(--warn)';
        } else if (monthsToGoal > 3) {
          maxPctOfExcess = 0.05; label = 'Cercano'; labelColor = 'var(--warn)';
        } else {
          maxPctOfExcess = 0; label = 'Inminente'; labelColor = 'var(--bad)';
        }

        const conservativeMXN = Math.round(excess * maxPctOfExcess * 0.5); // mitad de lo máximo
        const aggressiveMXN = Math.round(excess * maxPctOfExcess);

        // Plazo recomendado: meses hasta la meta menos colchón
        const recommendedHoldMonths = Math.max(0, Math.floor(monthsToGoal - SAFETY_MONTHS));

        return {
          ...g,
          remainingMXN,
          monthsToGoal,
          currentSaved,
          liquidNeeded,
          excess,
          maxPctOfExcess,
          conservativeMXN,
          aggressiveMXN,
          recommendedHoldMonths,
          label,
          labelColor,
        };
      });

      const totalConservative = goalAnalysis.reduce((sum, g) => sum + g.conservativeMXN, 0);
      const totalAggressive = goalAnalysis.reduce((sum, g) => sum + g.aggressiveMXN, 0);
      const totalParked = goals.reduce((sum, g) => sum + g.current, 0);

      // Personalized message based on crypto P&L
      let cryptoMoodMessage = '';
      if (s.totalInvestedMXN === 0) {
        cryptoMoodMessage = `Aún no tienes crypto. Si decides entrar, los números abajo te dicen exactamente cuánto MXN podrías mover de cada meta sin comprometer tus objetivos.`;
      } else if (s.totalPLPct > 20) {
        cryptoMoodMessage = `🔥 <strong>Tu crypto está +${s.totalPLPct}%.</strong> Buen momento para considerar tomar ganancias parciales. Vender un 20-30% y mandarlo a la meta más cercana es una estrategia clásica.`;
      } else if (s.totalPLPct > 0) {
        cryptoMoodMessage = `📈 <strong>Estás +${s.totalPLPct}%.</strong> Ganancia modesta. Los montos sugeridos abajo siguen aplicando — si quieres aumentar posición, hazlo desde excedentes de metas lejanas.`;
      } else if (s.totalPLPct > -15) {
        cryptoMoodMessage = `📉 <strong>Estás ${s.totalPLPct}%.</strong> Caída moderada. NO vendas en pánico. Estos números asumen que mantienes tu posición — si crees en el activo, considera estos montos para promediar a la baja, no para liquidar.`;
      } else {
        cryptoMoodMessage = `🚨 <strong>Caída fuerte (${s.totalPLPct}%).</strong> Esto es exactamente cuando la gente vende y pierde de verdad. Si tu tesis original sigue válida, mantén. NO uses estos números para meter más ahora si estás emocionalmente agitado.`;
      }

      return `
        <div class="card fade-in">
          <div class="card-head">
            <div class="card-title">💡 Smart allocation</div>
            <div class="card-meta">Cuánto y cuándo, en pesos reales</div>
          </div>

          <div class="insight" style="margin-bottom:1rem">${cryptoMoodMessage}</div>

          <div style="background:var(--bg-elev);padding:1rem;border-radius:var(--radius-sm);margin-bottom:1.5rem;font-size:13px;color:var(--ink-soft);line-height:1.7">
            <strong style="color:var(--ink)">📐 Cómo se calcula esto:</strong><br>
            • De cada meta, se reserva un <strong>colchón de seguridad de 3 meses</strong> de aportes (lo que pondrías en los próximos 3 meses).<br>
            • El resto se considera "excedente" que podría trabajar más fuerte.<br>
            • De ese excedente, se sugiere mover un % según qué tan lejos esté la meta.<br>
            • La columna <strong>"Conservador"</strong> es la mitad del máximo. <strong>"Agresivo"</strong> es el máximo del rango.
          </div>

          <table class="budget-table">
            <thead>
              <tr>
                <th>Meta</th>
                <th class="num">Guardado</th>
                <th class="num">Líquido necesario</th>
                <th class="num">Excedente</th>
                <th>Horizonte</th>
                <th class="num" style="color:var(--good)">Conservador</th>
                <th class="num" style="color:var(--warn)">Agresivo</th>
                <th class="num">Plazo</th>
              </tr>
            </thead>
            <tbody>
              ${goalAnalysis.map(g => `
                <tr>
                  <td class="cat">${g.name}</td>
                  <td class="num">${mxn(g.currentSaved)}</td>
                  <td class="num" style="color:var(--ink-mute)">${mxn(g.liquidNeeded)}</td>
                  <td class="num">${mxn(g.excess)}</td>
                  <td><span style="color:${g.labelColor};font-weight:500">${g.label}</span><br><span style="font-size:11px;color:var(--ink-mute)">${g.monthsToGoal === Infinity ? '∞' : Math.ceil(g.monthsToGoal)} meses a meta</span></td>
                  <td class="num" style="color:var(--good);font-weight:500">${g.conservativeMXN > 0 ? mxn(g.conservativeMXN) : '—'}</td>
                  <td class="num" style="color:var(--warn);font-weight:500">${g.aggressiveMXN > 0 ? mxn(g.aggressiveMXN) : '—'}</td>
                  <td class="num">${g.recommendedHoldMonths > 0 ? g.recommendedHoldMonths + ' mo' : '—'}</td>
                </tr>
              `).join('')}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="5" style="font-weight:500">Total recomendado</td>
                <td class="num" style="color:var(--good);font-weight:600">${mxn(totalConservative)}</td>
                <td class="num" style="color:var(--warn);font-weight:600">${mxn(totalAggressive)}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>

          ${totalAggressive > 0 ? `
            <div class="insight good" style="margin-top:1rem">
              <strong>📊 Recomendación específica:</strong><br>
              Podrías mover entre <strong>${mxn(totalConservative)}</strong> (conservador) y <strong>${mxn(totalAggressive)}</strong> (agresivo) a crypto sin comprometer tus metas, manteniendo un colchón de 3 meses de aportes en cada una.<br><br>
              <strong>Plazo recomendado:</strong> mantén estas posiciones por al menos el plazo que indica cada fila. Antes de ese plazo, retira para llenar la meta a tiempo.
            </div>
          ` : `
            <div class="insight warn" style="margin-top:1rem">
              <strong>⚠️ Por ahora, mejor no.</strong> Tus metas están en horizontes muy cercanos o no tienes excedente sobre el colchón de seguridad. Sigue ahorrando normal — cuando alguna meta tenga más de 6 meses de excedente sobre el colchón, los números arriba cambiarán.
            </div>
          `}

          <div class="smart-insight" style="margin-top:1rem">
            ⚠️ <strong>No es asesoría financiera.</strong> Estos cálculos asumen que tus metas se mantienen y que crypto puede caer 30-50% en semanas. Si pierdes el 50% del monto que metiste, ¿podrías seguir durmiendo tranquilo y llegar a tu meta? Si la respuesta es no, mejor quédate en pesos.
          </div>
        </div>
      `;
    }

    async function refreshPrices() {
      updating = true;
      const btn = document.getElementById('refresh-btn');
      if (btn) btn.innerHTML = '⏳ Updating...';
      const result = await fetchCryptoPrices();
      if (result.errors > 0) {
        alert('Error fetching prices: ' + (result.message || 'unknown'));
      }
      updating = false;
      render();
    }

    function updatePrice(id, val) {
      const a = state.crypto.assets.find(x => x.id === id);
      if (a) {
        a.currentPrice = parseFloat(val) || 0;
        saveState();
        render();
      }
    }

    function updateHolding(id, val) {
      const a = state.crypto.assets.find(x => x.id === id);
      if (a) {
        a.holdings = parseFloat(val) || 0;
        saveState();
        render();
      }
    }

    function updateInvested(id, val) {
      const a = state.crypto.assets.find(x => x.id === id);
      if (a) {
        a.investedMXN = parseFloat(val) || 0;
        saveState();
        render();
      }
    }

    function addAsset() {
      const symbol = prompt('Asset symbol (e.g., ADA, DOGE):');
      if (!symbol) return;
      const sym = symbol.toUpperCase();
      const autoPrice = !!COINGECKO_IDS[sym];
      const name = autoPrice ? sym : (prompt('Display name:') || sym);
      state.crypto.assets.push({
        id: 'a' + Date.now(),
        symbol: sym,
        name,
        currentPrice: 0,
        currentPriceUsd: 0,
        autoPrice,
        holdings: 0,
        investedMXN: 0,
      });
      saveState();
      if (autoPrice) refreshPrices();
      else render();
    }

    function deleteAsset(id) {
      const a = state.crypto.assets.find(x => x.id === id);
      if (!a) return;
      if (!confirm('Remove ' + a.symbol + '?')) return;
      state.crypto.assets = state.crypto.assets.filter(x => x.id !== id);
      saveState();
      render();
    }

    render();
    // Auto-update prices on page load if it's been > 1 hour
    if (!state.crypto.lastPriceUpdate ||
        (new Date() - new Date(state.crypto.lastPriceUpdate)) > 3600000) {
      refreshPrices();
    }
  </script>
</body>
</html>
